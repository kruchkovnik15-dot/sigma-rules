title: Suspicious Certutil Payload Retrieval Or Decode Activity

id: 8c9dcb32-7f43-42e5-92ec-7c2a1f5a4d31

status: stable

description: Detects Certutil usage associated with payload download, file decoding, certificate abuse, alternate data streams, and LOLBin tradecraft commonly observed during malware delivery and post-exploitation.

author: Nikolai Kruchkov

date: 2026-06-02

references:
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1140/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/

logsource:
  product: windows
  category: process_creation

detection:

  selection_image:
    Image|endswith:
      - '\certutil.exe'

  selection_download:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - '-urlcache'
      - '-verifyctl'

  selection_decode:
    CommandLine|contains:
      - '-decode'
      - '-decodehex'
      - '-encode'

  selection_ads:
    CommandLine|contains:
      - ':Zone.Identifier'
      - ':payload'

  condition: selection_image and 1 of selection_*

falsepositives:
  - Certificate management operations
  - PKI administration
  - Approved deployment tooling

level: high

tags:
  - attack.command_and_control
  - attack.t1105
  - attack.defense_evasion
  - attack.t1140
