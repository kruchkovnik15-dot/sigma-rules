title: Office Application Spawning PowerShell
id: 91d73f5f-5d1f-4f58-8b68-7f7c9e4d2b11
status: test

description: Detects Microsoft Office applications spawning PowerShell which may indicate malicious macro execution.

author: Nikolai Kruchkov

date: 2026-06-01

references:
  - https://attack.mitre.org/techniques/T1204/
  - https://attack.mitre.org/techniques/T1059/001/

logsource:
  product: windows
  category: process_creation

detection:

  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'

  selection_child:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  condition: selection_parent and selection_child

falsepositives:
  - Administrative automation
  - Internal office integrations
  - Approved business tooling

level: high

tags:
  - attack.execution
  - attack.t1059.001
  - attack.user_execution
  - attack.t1204
