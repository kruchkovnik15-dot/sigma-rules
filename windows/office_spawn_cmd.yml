title: Office Application Spawning CMD
id: 3d85c2d8-fc0c-4dc7-a6b0-9e47d54e4c21
status: test

description: Detects Microsoft Office applications spawning cmd.exe which may indicate malicious macro execution or user execution activity.

author: Nikolai Kruchkov

date: 2026-06-01

references:
  - https://attack.mitre.org/techniques/T1204/
  - https://attack.mitre.org/techniques/T1059/003/

logsource:
  product: windows
  category: process_creation

detection:

  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'

  selection_child:
    Image|endswith:
      - '\cmd.exe'

  condition: selection_parent and selection_child

falsepositives:
  - Administrative automation
  - Internal office integrations
  - Approved business tooling

level: high

tags:
  - attack.execution
  - attack.t1059.003
  - attack.user_execution
  - attack.t1204
