title: Suspicious Regsvr32 Remote Scriptlet Execution

id: b42e44d6-c31a-4e95-a51f-74cb1d48e5ab

status: stable

description: Detects Regsvr32 abuse involving remote scriptlets, Squiblydoo tradecraft, suspicious DLL retrieval, and proxy execution techniques frequently observed during malware delivery and defense evasion.

author: Nikolai Kruchkov

date: 2026-06-02

references:
  - https://attack.mitre.org/techniques/T1218/010/
  - https://lolbas-project.github.io/lolbas/Binaries/Regsvr32/

logsource:
  product: windows
  category: process_creation

detection:

  selection_image:
    Image|endswith:
      - '\regsvr32.exe'

  selection_remote:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'

  selection_scriptlet:
    CommandLine|contains:
      - 'scrobj.dll'
      - '.sct'

  selection_silent:
    CommandLine|contains:
      - '/s'
      - '/n'
      - '/u'
      - '/i:'

  condition: selection_image and selection_remote and 1 of selection_*

falsepositives:
  - Administrative scripting
  - Application registration workflows
  - Internal software testing

level: high

tags:
  - attack.defense_evasion
  - attack.execution
  - attack.t1218.010
